<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast Weather App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-indigo-200 p-5 bg-[url(/assets/weather6.avif)] bg-no-repeat bg-cover">
    <h1 class="bg-indigo-400 text-2xl lg:text-3xl py-3 w-full mx-auto rounded-md my-2 
        shadow-md text-center border-2 border-indigo-100 tracking-widest font-bold">
        SkyCast</h1>



    <!-- START OF SEARCH FORM -->
    <form id="search-form" class="flex flex-col mx-auto justify-end ml-auto items-end mr-4 gap-2 text-white">
        <label for="search-input" class="font-semibold text-xl">Search for a city</label>
        <input id="search-input" type="text" placeholder="Enter a city..."
            class="w-40 text-center border border-2 p-1 rounded-md focus:border-indigo-600">
        <button type="submit" class="border border-2 rounded-md px-5">Search</button>
    </form>
    <p id="status" class="text-right text-white"></p>

    <!-- START OF GEOLOCATION -->

    <div class="flex flex-col justify-end items-end mr-4 gap-2 text-white">
        <p id="loc-status" class="text-[17px] pt-3 font-semibold">Use your current location:</p>
        <button id="find-me" class="border-2 rounded-md px-4 text-center">Find me</button>

    </div>



    <!-- TODAY CARD -->
    <div
        class="flex flex-col bg-indigo-300 p-5 mx-auto border border-2 h-auto lg:h-115 mt-5 rounded-md opacity-70 md:border-white">
        <div id="today-location"></div>
        <div id="today-temp" class="flex justify-center items-center"></div>
        <div id="today-bottom" class="flex justify-between items-end">
            <div id="bottom-left" class="flex flex-col"></div>
            <div id="bottom-right" class="text-right"></div>
        </div>
    </div>


    <!-- 5 DAY FORECAST -->
    <div id="forecast"
        class="grid grid-cols-2 lg:grid-cols-5 rounded-md mt-5 gap-5 justify-evenly text-center opacity-70"></div>



    <script type="module" src="./js/script.js"></script>
</body>

</html>
